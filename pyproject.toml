[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clickshift"
version = "1.0.23"
description = "Ultra-fast local document converter with right-click menu, startup daemon and adaptive ML backend routing"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.2",
  "python-docx>=1.1",
  "python-pptx>=1.0.2",
  "pdf2docx>=0.5.8",
  "PyMuPDF>=1.24.0",
  "pypdf>=4.0",
  "chardet>=5.2",
]

[project.optional-dependencies]
windows = ["pywin32>=306", "pystray>=0.19.5"]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.scripts]
clickshift = "clickshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
pythonPlatform = "Windows"
reportMissingImports = "none"
reportMissingModuleSource = "none"
