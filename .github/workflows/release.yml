name: release exe (download link)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.25)"
        required: true
        default: "v1.0.25"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", architecture: x64 }
      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
      - name: Generate icon (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path assets/clickshift.ico) -or -not (Test-Path assets/clickshift.png)) {
            python scripts/make_icon.py
          }
      - name: Build Win11 IExplorerCommand Shell Extension & MSIX
        run: powershell -ExecutionPolicy Bypass -File scripts/build_shell_ext.ps1
      - name: Build versioned ClickShift EXE
        run: python build.py
      - name: Create unversioned ClickShift.exe alias for permanent latest download URL
        shell: pwsh
        run: |
          $built = Get-ChildItem dist/ClickShift-v*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $built) { throw "No ClickShift-v*.exe found in dist/" }
          Copy-Item $built.FullName dist/ClickShift.exe -Force
      - name: Compute SHA256SUMS.txt
        run: python scripts/sign_release.py sums dist/ClickShift*.exe --out dist/SHA256SUMS.txt
      - name: Record build commit + timestamp
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $ts  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Set-Content -Path dist/build-info.txt -Value "commit=$sha`nbuilt_at=$ts`ntag=$tag"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-staging
          path: |
            dist/ClickShift*.exe
            dist/SHA256SUMS.txt
            dist/build-info.txt

  publish-release:
    needs: build-exe
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", architecture: x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-staging
          path: release-out
      - name: Install cryptography for release signing
        run: pip install cryptography==46.0.7
      - name: Sign ClickShift EXE (if CLICKSHIFT_SIGNING_KEY_B64 is configured)
        shell: pwsh
        env:
          CLICKSHIFT_SIGNING_KEY_B64: ${{ secrets.CLICKSHIFT_SIGNING_KEY_B64 }}
        run: |
          if ($env:CLICKSHIFT_SIGNING_KEY_B64) {
            Get-ChildItem release-out -Recurse -Filter "ClickShift*.exe" | ForEach-Object {
              python scripts/sign_release.py sign $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } else {
            Write-Host "CLICKSHIFT_SIGNING_KEY_B64 not set; publishing SHA256SUMS.txt only (see docs/PUBLISHING_AND_CLOUD.md)."
          }
      - name: Create / update GitHub Release with verified assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-out/**/ClickShift*.exe
            release-out/**/ClickShift*.exe.sig
            release-out/**/SHA256SUMS.txt
            release-out/**/build-info.txt
          body: |
            ## ClickShift Windows EXE

            Direct download (always latest):
            https://github.com/${{ github.repository }}/releases/latest/download/ClickShift.exe

            Latest release page:
            https://github.com/${{ github.repository }}/releases/latest

            Built from commit `${{ github.sha }}`.
