name: release exe (download link)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.19)"
        required: true
        default: "v1.0.19"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  build-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", architecture: x64 }
      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
      - name: Generate icon (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path assets/clickshift.ico) -or -not (Test-Path assets/clickshift.png)) {
            python scripts/make_icon.py
          }
      - name: Build Win11 IExplorerCommand Shell Extension & MSIX
        run: powershell -ExecutionPolicy Bypass -File scripts/build_shell_ext.ps1
      - name: Build versioned ClickShift EXE
        run: python build.py
      - name: Compute SHA256SUMS.txt
        run: python scripts/sign_release.py sums dist/ClickShift-v*.exe --out dist/SHA256SUMS.txt
      - name: Record build commit + timestamp
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $ts  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          Set-Content -Path dist/build-info.txt -Value "commit=$sha`nbuilt_at=$ts`ntag=$tag"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-staging
          path: |
            dist/ClickShift-v*.exe
            dist/SHA256SUMS.txt
            dist/build-info.txt

  publish-release:
    needs: build-exe
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", architecture: x64 }
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-staging
          path: release-out
      - name: Install cryptography for release signing
        run: pip install cryptography==46.0.7
      - name: Sign ClickShift EXE (if CLICKSHIFT_SIGNING_KEY_B64 is configured)
        shell: pwsh
        env:
          CLICKSHIFT_SIGNING_KEY_B64: ${{ secrets.CLICKSHIFT_SIGNING_KEY_B64 }}
        run: |
          if ($env:CLICKSHIFT_SIGNING_KEY_B64) {
            Get-ChildItem release-out -Recurse -Filter "ClickShift-v*.exe" | ForEach-Object {
              python scripts/sign_release.py sign $_.FullName
            }
          } else {
            Write-Host "CLICKSHIFT_SIGNING_KEY_B64 not set; publishing SHA256SUMS.txt only (see docs/PUBLISHING_AND_CLOUD.md)."
          }
      - name: Create / update GitHub Release with verified assets
        uses: softprops/action-gh-release@c062e08bd532515e0ef826c8304c599b80371045 # v2.2.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-out/ClickShift-v*.exe
            release-out/ClickShift-v*.exe.sig
            release-out/SHA256SUMS.txt
            release-out/build-info.txt
          body: |
            ## ClickShift Windows EXE

            Latest release page:
            https://github.com/${{ github.repository }}/releases/latest

            Built from commit `${{ github.sha }}`.
