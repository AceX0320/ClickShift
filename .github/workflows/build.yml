name: build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install test dependencies (slim = same matrix as verified local runs)
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy Pillow python-docx pypdf PyMuPDF chardet charset-normalizer
      - name: Run tests
        run: python -m pytest tests/ -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", architecture: x64 }
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
          pip install pywin32 pystray
      - name: Generate icon (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path assets/confas.ico) -or -not (Test-Path assets/confas.png)) {
            python scripts/make_icon.py
          }
      - name: Build Win11 IExplorerCommand Shell Extension & MSIX
        run: powershell -ExecutionPolicy Bypass -File scripts/build_shell_ext.ps1
      - name: Build ConFas.exe
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ConFas-windows-exe
          path: dist/ConFas.exe
      - name: Publish latest GitHub Release (on main push)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.12
          name: ConFas v1.0.12 (Latest Build)
          make_latest: "true"
          files: dist/ConFas.exe
          body: |
            ## ConFas Windows EXE (v1.0.12)

            **Direct download (always the newest release):**
            https://github.com/${{ github.repository }}/releases/latest/download/ConFas.exe

            **Direct download (pinned to v1.0.12):**
            https://github.com/${{ github.repository }}/releases/download/v1.0.12/ConFas.exe

            Built automatically from commit `${{ github.sha }}`.

