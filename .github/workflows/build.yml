name: build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", architecture: x64 }
      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
      - name: Generate icon (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path assets/clickshift.ico) -or -not (Test-Path assets/clickshift.png)) {
            python scripts/make_icon.py
          }
      - name: Build Win11 IExplorerCommand Shell Extension & MSIX
        run: powershell -ExecutionPolicy Bypass -File scripts/build_shell_ext.ps1
      - name: Build versioned ClickShift EXE
        run: python build.py
      - name: Generate build SHA-256 sums
        run: python scripts/sign_release.py sums dist/ClickShift-v*.exe --out dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClickShift-windows-exe
          path: |
            dist/ClickShift-v*.exe
            dist/SHA256SUMS.txt
