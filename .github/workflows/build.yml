name: build & test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", architecture: x64 }
      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
      - name: Generate icon (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path assets/clickshift.ico) -or -not (Test-Path assets/clickshift.png)) {
            python scripts/make_icon.py
          }
      - name: Build Win11 IExplorerCommand Shell Extension & MSIX
        run: powershell -ExecutionPolicy Bypass -File scripts/build_shell_ext.ps1
      - name: Build versioned ClickShift EXE
        run: python build.py
      - name: Generate build SHA-256 sums
        run: python scripts/sign_release.py sums dist/ClickShift-v*.exe --out dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClickShift-windows-exe
          path: |
            dist/ClickShift-v*.exe
            dist/SHA256SUMS.txt
