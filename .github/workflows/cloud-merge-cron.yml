name: cloud learnings merge (every 6 h)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      CLICKSHIFT_GIST_ID: ${{ secrets.CLICKSHIFT_GIST_ID }}
      CLICKSHIFT_CLOUD_TOKEN: ${{ secrets.CLICKSHIFT_CLOUD_TOKEN }}
    steps:
      - name: Skip gracefully when the shared pool is not configured
        if: env.CLICKSHIFT_GIST_ID == '' || env.CLICKSHIFT_CLOUD_TOKEN == ''
        run: |
          echo "cloud pool not configured (CLICKSHIFT_GIST_ID / CLICKSHIFT_CLOUD_TOKEN secrets not set)."
          echo "Nothing to merge - expected until the owner creates the gist (README: Shared learnings)."
          echo "Skipping instead of failing."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.CLICKSHIFT_GIST_ID != '' && env.CLICKSHIFT_CLOUD_TOKEN != ''
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.CLICKSHIFT_GIST_ID != '' && env.CLICKSHIFT_CLOUD_TOKEN != ''
        with: { python-version: "3.12" }
      - name: Install numpy
        if: env.CLICKSHIFT_GIST_ID != '' && env.CLICKSHIFT_CLOUD_TOKEN != ''
        run: pip install numpy==2.4.6
      - name: Recompute merged.json from contrib-*.json files
        if: env.CLICKSHIFT_GIST_ID != '' && env.CLICKSHIFT_CLOUD_TOKEN != ''
        env:
          CLICKSHIFT_GIST_ID: ${{ secrets.CLICKSHIFT_GIST_ID }}
          CLICKSHIFT_CLOUD_TOKEN: ${{ secrets.CLICKSHIFT_CLOUD_TOKEN }}
        run: PYTHONPATH=src python -m clickshift.cloud --merge-gist
